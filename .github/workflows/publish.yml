name: Publish to PyPI

# Run manually after configuring the matching trusted publisher on PyPI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database build dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
      - name: Install development dependencies
        run: python -m pip install '.[test]' twine
      - name: Verify source
        run: |
          python -m ruff check .
          python -m pytest -q
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aa-planetary-operations
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@release/v1
