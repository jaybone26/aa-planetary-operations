[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-planetary-operations"
version = "0.1.1"
description = "Multi-character planetary industry planning for Alliance Auth v5"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Jayybone"}]
keywords = ["allianceauth", "eve-online", "planetary-industry"]
dependencies = ["allianceauth>=5.0,<6", "requests>=2.32,<3", "ortools>=9.10,<10"]

[project.urls]
Homepage = "https://github.com/jaybone26/aa-planetary-operations"
Documentation = "https://github.com/jaybone26/aa-planetary-operations#readme"
Repository = "https://github.com/jaybone26/aa-planetary-operations"
Issues = "https://github.com/jaybone26/aa-planetary-operations/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4.8", "requests-mock>=1.12", "fakeredis>=2", "ruff", "build"]

[tool.setuptools.packages.find]
include = ["planetary_operations*"]

[tool.setuptools.package-data]
planetary_operations = ["data/*.json", "templates/planetary_operations/*.html", "static/planetary_operations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
